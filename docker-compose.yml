name: soreal

networks:
  brd-soreal:
    external: false

services:
  soreal:
    image: soreal:latest
    ports:
      - 80:80/tcp # port 80 must be identity mapped for ACME challenges
      - 443/tcp # xray (VLESS + Vision + TLS) port; any port except 80 and 12345
    environment:
      HOST: "example.com" # Your domain name
      PORT: "443" # which port you use to access xray? for QR code and shared link generation; must not be 80, 12345, 12346
      USER0: "alice" # An arbitrary number of users; X must be strictly incrementing by 1.
      USER1: "bob"
      # ...
      SITE_URL: "decoy:3000" # address of the decoy site backend; comment out to return 404 for all non-proxied requests
      UPSTREAM_URL: "filter:1080" # upstream socks5 proxy address (carries UDP too), set empty to dial directly
      LOG_LEVEL: "info"
      SELF_SIGN: "true"
    restart: unless-stopped
    networks:
      - brd-soreal
    volumes:
      - ./data:/opt/soreal/data:Z # contains logs, certs, etc.
    cap_add:
      - CAP_NET_BIND_SERVICE
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=80